name: iris-hud-browser-smoke

on:
  push:
    branches: [workbench/iris-ui]
  pull_request:
    branches: [main]
    paths:
      - "holographic-core/v2/**"
      - "workers/iris-bridge.js"
      - "tests/browser/**"
      - ".github/workflows/iris-hud-browser-smoke.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    name: HUD browser smoke tests (mock API only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser tests
        run: node tests/browser/iris-hud-smoke.cjs
